name: Release Timo

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o timo-linux-amd64
          GOOS=linux GOARCH=arm64 go build -o timo-linux-arm64
          GOOS=darwin GOARCH=amd64 go build -o timo-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o timo-darwin-arm64

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            timo-linux-amd64
            timo-linux-arm64
            timo-darwin-amd64
            timo-darwin-arm64
